services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ENABLE_LLM_FALLBACK: ${ENABLE_LLM_FALLBACK:-false}
      USE_LLM_ANSWER: ${USE_LLM_ANSWER:-false}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/bi.db}
      MAX_RESULT_ROWS: ${MAX_RESULT_ROWS:-200}
      MAX_RECOVERY_RETRIES: ${MAX_RECOVERY_RETRIES:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./context:/app/context:ro
      - ./db-files:/db-files:ro
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend
